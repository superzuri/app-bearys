name: Procesar salidas de Beary's

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bearys-checkout-notifications
  cancel-in-progress: false

jobs:
  process-checkouts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        working-directory: push-notifications
        run: npm install --omit=dev --no-audit --no-fund
      - name: Avisar salidas y revisar el cierre
        working-directory: push-notifications
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          BEARY_MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        run: npm run process-checkouts
